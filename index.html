<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mini me studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div id="intro"><img src="https://raw.githubusercontent.com/alisayed2008/3d-model-hub/main/src/assets/1.gif" alt="mini me"></div><div class="shell"><div class="dots"></div><header><div class="brand"><img src="https://raw.githubusercontent.com/alisayed2008/3d-model-hub/main/src/assets/minilogo.svg"><div class="toolbar"><button class="save" id="save">Save</button><i>|</i><button id="back">Back</button><button class="icon" id="backIcon">←</button><i>-</i><button class="icon" id="forwardIcon">→</button><button id="forward">Forward</button><i>|</i><button id="zin">⌕ Zoom In</button><i>-</i><button id="zout">⌕ Zoom Out</button></div></div><div class="credits"><b id="credits">10 credits</b><small>renewed every 24 hs</small></div></header><main><aside class="left"><section><label><span>?</span>Upload</label><div class="upload" id="upload"><strong>Upload</strong><p>ارفع قرابة الـ 1 إلى 5 صور من نفس الشكل.</p><div class="uploadIcon">↑</div><input id="files" type="file" accept="image/*" multiple></div><div class="thumbs" id="thumbs"></div></section><section><label><span>?</span>style :</label><div class="choices" id="styles"><button class="active" data-value="figure">Figure</button><button data-value="funko">fanko</button><button data-value="voxel">voxel</button></div><small>Choose the appropriate style</small></section><section><label><span>?</span>Model size :</label><div class="choices sizes" id="sizes"><button data-value="8cm">8cm</button><button class="active recommended" data-value="10cm">10cm</button><button data-value="15cm">15cm</button></div></section><button class="generation" id="generate">generation <em>5 Credits</em></button><div class="price"><strong id="price">Total price: 2000 EGP</strong><button id="buy" disabled>buy</button></div></aside><section class="stageWrap"><div class="stage" id="stage"><div id="model"><div class="empty">YOUR GENERATED<br>MODEL APPEARS HERE</div></div><img class="watermark" src="https://raw.githubusercontent.com/alisayed2008/3d-model-hub/main/src/assets/minilogo.svg"></div></section><aside class="rail"><button id="note">✎<b>note</b></button><button id="download">⇩<b>download</b></button><button id="share">↗<b>Share</b></button></aside></main></div><div id="noteCursor">note</div><div id="buyModal"><form id="order"><button type="button" class="close" id="close">×</button><h2>Order your mini me</h2><input required placeholder="Name" id="name"><input required placeholder="Detailed address" id="address"><input required placeholder="Phone" id="phone"><input required type="email" placeholder="Email" id="email"><div class="payments"><button type="button" data-pay="instapay"><img src="https://raw.githubusercontent.com/alisayed2008/3d-model-hub/main/src/assets/payment/instapay.png"></button><button type="button" data-pay="vodafone"><img src="https://raw.githubusercontent.com/alisayed2008/3d-model-hub/main/src/assets/payment/vodafone-cash.png"></button><button type="button" data-pay="paypal"><img src="https://raw.githubusercontent.com/alisayed2008/3d-model-hub/main/src/assets/payment/paypal.png"></button></div><button class="send">Send order</button><p id="status"></p></form></div><script src="app.js"></script></body></html>
